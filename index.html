<!DOCTYPE html>
<html>
<head>
  <title>Robayed AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      margin:0;
      padding:0;
    }

    .chat-box{
      height:80vh;
      overflow:auto;
      padding:10px;
    }

    .input-box{
      display:flex;
      padding:10px;
      background:#222;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      font-size:16px;
    }

    button{
      padding:12px;
      margin-left:10px;
      border:none;
      border-radius:10px;
      background:#00ff99;
      font-weight:bold;
    }

    .user{
      color:#00ff99;
      margin:10px 0;
    }

    .bot{
      color:#00ccff;
      margin:10px 0;
    }

  </style>
</head>

<body>

<div class="chat-box" id="chat"></div>

<div class="input-box">
  <input type="text" id="msg" placeholder="Type message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>

async function sendMessage(){

  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");

  const message = input.value;

  if(message === "") return;

  chat.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;

  input.value = "";

  try {

    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer 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",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "google/gemma-2-9b-it:free",
        messages: [
          {
            role: "user",
            content: message
          }
        ]
      })
    });

    const data = await response.json();

    console.log(data);

    const reply = data.choices?.[0]?.message?.content || "No reply";;

    chat.innerHTML += `<div class="bot"><b>AI:</b> ${reply}</div>`;

    chat.scrollTop = chat.scrollHeight;

  } catch(error){

    chat.innerHTML += `<div class="bot"><b>Error:</b> API not working</div>`;

    console.log(error);

  }

}

</script>

</body>
</html>
